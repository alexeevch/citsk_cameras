services:
  cameras-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: cameras-backend
    depends_on:
      - postgres
      - redis
    volumes:
      - ./src:/var/www/html

  postgres:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
