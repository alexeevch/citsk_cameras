services:
  cameras-backend:
    ports:
      - "8080:8080"
    environment:
      APP_ENV: dev
    volumes:
      - src:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d db" ]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    environment:
      TZ: Europe/Moscow
    ports:
      - "6379:6379"
    command: redis-server --requirepass pass
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1024M
        reservations:
          memory: 512M
